name: Android Build

# 触发条件：代码推送到主分支，或者在 Actions 页面手动点击运行
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码 (Checkout)
      uses: actions/checkout@v4

    - name: 配置 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle' # 开启缓存，第二次起打包速度会快很多

    - name: 授予 gradlew 执行权限
      run: chmod +x gradlew

    - name: 编译 Debug 版 APK (测试版)
      run: ./gradlew assembleDebug --no-daemon

   

    - name: 上传 Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Melox-Debug-APK
        path: app/build/outputs/apk/debug/*.apk

   